<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <textarea class="token-input" rows="10" placeholder="请输入token"></textarea>
  <button onclick="openFrame('test-')">创建测试</button>
  <button onclick="openFrame()">创建</button>
  <!-- <iframe class="console-admin" style="width: 100%; height: 100vh" src="" frameborder="0" allow="local-network; loopback-network; local-network-access"></iframe> -->
  <script>
    function openFrame(test = "") {
      const iframe = document.createElement("iframe");
      iframe.style.cssText = `width: 100%; height: 100vh`;
      iframe.frameBorder = "0";
      iframe.allow = "local-network; loopback-network; local-network-access";
      /** 登录token */
      const token = document.querySelector(".token-input").value;
      /** 页面路径 */
      const path = "/jscodes";
      // 正式环境：
      const url = `https://${test}console.changzhi.top/#${path}?login_token=${token}&iframe=1&search=1`;
      iframe.src = url;
      document.body.appendChild(iframe);
    }
  </script>
</body>
</html>
